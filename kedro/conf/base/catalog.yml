# Datasets catalogados para o Kedro-Viz mostrar uma prévia real dos dados em
# cada passo (pedido do usuário: "ver como estão sendo construídos os dados
# usados para serem computados").
#
# IMPORTANTE — por que só ESTES passos estão catalogados: catalogar um
# dataset no Kedro não é "salvar uma cópia para inspeção" — o runner
# literalmente SALVA e RECARREGA o valor do arquivo entre o nó produtor e
# qualquer nó consumidor (troca o objeto Python em memória pelo resultado
# do round-trip via disco). Testado e confirmado nesta sessão que isso
# quebra:
#   - pandas.Series com índice não-trivial (DatetimeIndex, índice de mês)
#     -> volta do CSV como DataFrame com RangeIndex genérico.
#   - dict com chaves inteiras (ex.: {0: valor, 1: valor, ...}) via JSON
#     -> chaves viram string (JSON não tem chave inteira).
# Por isso `pixel`, `pixel_series`, `climatology`, `anomaly`,
# `anomaly_*`, `alpha_*`, `r2_*` ficam como MemoryDataset (implícito, sem
# entrada aqui) — catalogá-los exigiria normalizar tipo/chave em cada nó
# consumidor, risco desnecessário para uma pipeline de demonstração.
#
# Os 3 passos abaixo SÃO seguros: já são DataFrames "tidy" (colunas planas,
# RangeIndex trivial), então salvar+recarregar não muda nada:
#   - aligned_* — o momento mais importante para validar a construção dos
#     dados: o MoV já alinhado no lag, lado a lado com a anomalia de
#     precipitação, por observação — exatamente o que entra na equação.
#   - result_* / predep_results — os resultados finais (α, r², n_obs).
#
# `metadata.kedro-viz.preview_args` é OBRIGATÓRIO para o Kedro-Viz de fato
# chamar `.preview()` do dataset — sem isso o preview fica desabilitado por
# padrão, mesmo com o tipo certo declarado.

# ── Pipelines data_prep / predep_production / analysis ───────────────────
# Todos são saídas terminais ou DataFrames planos — sem risco de round-trip.

parana_mask_info:
  type: json.JSONDataset
  filepath: data/parana_mask_info.json
  metadata:
    kedro-viz:
      preview_args: {}

